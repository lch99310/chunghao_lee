{{ if .Params.collapseMobileToc }}
  <details class="-ms-5 mt-0 overflow-hidden rounded-lg ps-5 lg:hidden">
    <summary class="block cursor-pointer bg-neutral-100 py-1 ps-5 text-lg font-semibold text-neutral-800 dark:bg-neutral-700 dark:text-neutral-100">
      {{ i18n "article.table_of_contents" }}
    </summary>
    <div class="border-s border-dotted border-neutral-300 py-2 ps-5 dark:border-neutral-600">
      {{ .TableOfContents | emojify }}
    </div>
  </details>
  <div class="hidden border-s border-dotted border-neutral-300 py-2 ps-5 dark:border-neutral-600 lg:block">
    {{ .TableOfContents | emojify }}
  </div>
{{ else }}
  <details open class="-ms-5 mt-0 overflow-hidden rounded-lg ps-5">
    <summary class="block cursor-pointer bg-neutral-100 py-1 ps-5 text-lg font-semibold text-neutral-800 dark:bg-neutral-700 dark:text-neutral-100 lg:hidden">
      {{ i18n "article.table_of_contents" }}
    </summary>
    <div class="border-s border-dotted border-neutral-300 py-2 ps-5 dark:border-neutral-600">
      {{ .TableOfContents | emojify }}
    </div>
  </details>
{{ end }}
